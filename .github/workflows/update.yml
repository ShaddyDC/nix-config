name: update

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Update inputs
        run: |
          nix flake update 2> "$RUNNER_TEMP/update.log"
          {
            echo "Weekly \`nix flake update\`; \`nix flake check\` passed on it."
            echo
            echo '```'
            grep -v 'Git tree\|untrusted flake\|accept-flake-config' "$RUNNER_TEMP/update.log" || true
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"

      # If this fails, nixpkgs broke something; the failed run is the alert,
      # and no PR is opened.
      - run: nix flake check

      # Pull requests opened with GITHUB_TOKEN don't trigger other workflows,
      # which is why the check runs here, before the PR exists.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: flake-update
          delete-branch: true
          commit-message: "flake: Update inputs"
          title: "flake: Update inputs"
          body-path: ${{ runner.temp }}/pr-body.md
