name: check

# Security: these workflows load read-only deploy keys for the private flake
# inputs (nix-secrets, toddledo, kagi-pp-search). `pull_request` runs from forks
# never receive repository secrets, so outside PRs can't reach them. Never
# switch this to `pull_request_target` (which runs with secrets) while checking
# out PR code. Third-party actions are pinned to commit SHAs so a moved tag
# can't swap in code that reads the keys.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Private flake inputs (nix-secrets, toddledo, kagi-pp-search) are fetched
      # over SSH with per-repository read-only deploy keys.
      - uses: ./.github/actions/private-inputs
        with:
          nix-secrets-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          toddledo-key: ${{ secrets.TODDLEDO_DEPLOY_KEY }}
          kagi-pp-search-key: ${{ secrets.KAGI_PP_SEARCH_DEPLOY_KEY }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # Runs the treefmt and pre-commit checks and instantiates both NixOS
      # configurations (.drvPath). `nix flake check` alone only checks
      # `toplevel.type == "derivation"` (assertions/warnings) without forcing
      # package derivations; a full system build would need ~33 GiB, more than
      # a hosted runner has.
      - run: |
          nix flake check
          nix eval --raw .#nixosConfigurations.framework.config.system.build.toplevel.drvPath >/dev/null
          nix eval --raw .#nixosConfigurations.spacedesktop.config.system.build.toplevel.drvPath >/dev/null
